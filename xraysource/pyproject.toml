[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xraysource"
version = "0.1.0"
description = "X-ray source spectrum calculator: bending magnet, wiggler, undulator + filter stack"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Alberto Mittone", email = "amittone@anl.gov" }]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "xraylib>=4.0",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15", "pyqtgraph>=0.13"]
mpl = ["matplotlib>=3.4"]
dev = ["pytest"]

[project.scripts]
xraysource = "xraysource.cli:main"
xraysource-gui = "xraysource.gui:main"

[tool.setuptools.packages.find]
include = ["xraysource*"]
